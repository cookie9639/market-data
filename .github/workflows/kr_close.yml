name: 코스피 장마감 숫자 수집

on:
  schedule:
    # 한국시간 평일(월~금) 15:47, 16:13 = UTC 월~금 06:47, 07:13
    # GitHub 예약 실행은 1시간 가까이 늦게 시작되는 날이 많아 두 번 돌린다
    - cron: "47 6 * * 1-5"
    - cron: "13 7 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance requests lxml html5lib beautifulsoup4 pandas
      - run: python collect_kr_close.py
      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "장마감 숫자 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')" || echo "변경 없음"
          git pull --rebase
          git push
