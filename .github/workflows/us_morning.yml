name: 미장 아침 숫자 수집

on:
  schedule:
    # 한국시간 평일(월~금) 06:17, 06:33 = UTC 일~목 21:17, 21:33 (늦게 도는 경우 대비 두 번)
    - cron: "17 21 * * 0-4"
    - cron: "33 21 * * 0-4"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python collect_us_morning.py
      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "미장 아침 숫자 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')" || echo "변경 없음"
          git push
